<script>
(function () {
  var d = document, de = d.documentElement; de.classList.add('js');
  // abas fixas logo abaixo da barra de navegação
  var hdr = d.querySelector('#quarto-header'), abas = d.querySelector('.pv-abas');
  // o menu do Quarto some ao rolar para baixo (headroom): a barra de abas gruda no topo (top: 0)
  // âncoras da própria página (o Quarto pode reescrevê-las como endereços absolutos: usar .hash)
  function mesmaPagina(a) {
    var norm = function (p) { return p.replace(/index\.html$/, ''); };
    return a.hash && a.origin === location.origin && norm(a.pathname) === norm(location.pathname);
  }
  var links = [].slice.call(d.querySelectorAll('.pv-abas a')).filter(mesmaPagina);
  var alvos = links.map(function (a) { return d.querySelector(a.hash); });
  // scroll-spy: destaca a aba da seção visível
  function spy() {
    var y = (abas ? abas.offsetHeight : 0) + 40, atual = 0;
    alvos.forEach(function (s, i) { if (s && s.getBoundingClientRect().top - y <= 0) atual = i; });
    links.forEach(function (a, i) { a.classList.toggle('atual', i === atual); });
  }
  window.addEventListener('scroll', spy, { passive: true }); spy();
  // rolagem suave para as âncoras, descontando a barra de abas
  [].slice.call(d.querySelectorAll('a[href*="#"]')).filter(mesmaPagina).forEach(function (a) {
    a.addEventListener('click', function (e) {
      var s = d.querySelector(a.hash); if (!s) return; e.preventDefault();
      var top = s.getBoundingClientRect().top + window.scrollY - (abas ? abas.offsetHeight : 0);
      var red = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: top, behavior: red ? 'auto' : 'smooth' });
      if (history.replaceState) history.replaceState(null, '', a.hash);
    });
  });
  // entrada suave dos blocos
  var rev = [].slice.call(d.querySelectorAll('.pv-revela'));
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('visivel'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    rev.forEach(function (r) { io.observe(r); });
  } else { rev.forEach(function (r) { r.classList.add('visivel'); }); }
  // botões em pílula alternam o palco em destaque
  var pil = [].slice.call(d.querySelectorAll('.pv-pilulas button')), pal = [].slice.call(d.querySelectorAll('.pv-palcos .palco'));
  pil.forEach(function (b) {
    b.addEventListener('click', function () {
      pil.forEach(function (x) { x.classList.toggle('ativa', x === b); });
      pal.forEach(function (p) { p.classList.toggle('foco', p.getAttribute('data-p') === b.getAttribute('data-palco')); });
    });
  });
})();
</script>
